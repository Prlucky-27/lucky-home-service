    <h2>📋 Customer Request</h2>

    <form onsubmit="sendWhatsApp(); return false;">

        <input type="text" id="name" placeholder="Your Name" required><br><br>

        <select id="service" required>
            <option value="">Select Service</option>
            <option>Data Entry</option>
            <option>Online Form Filling</option>
            <option>Computer Work</option>
            <option>Basic Website Design</option>
        </select><br><br>

        <textarea id="message" placeholder="Write your requirement" required></textarea><br><br>

        <button type="submit">💬 Send Request on WhatsApp</button>

    </form>
</section>

<script>
function sendWhatsApp() {

    let name = document.getElementById("name").value;
    let service = document.getElementById("service").value;
    let message = document.getElementById("message").value;

    let text = "Hello Lucky Home Service!%0A%0A"
             + "Name: " + name + "%0A"
             + "Service: " + service + "%0A"
             + "Requirement: " + message;

    window.open("https://wa.me/919106885319?text=" + text, "_blank");
}
</script>
<section class="contact" id="contact">
